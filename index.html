<title>Giełda od Zera</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400..500&display=swap">
<style>
/* Układ: terminal. Menu boczne z ikonami po lewej, pasek indeksów nad treścią, gęste panele w siatce.
   Na telefonie menu staje się przewijanym paskiem u góry. Paleta blue-black-cornflower ze skilla taste, najpierw ciemna. */
:root {
  --bg: #0a0d14;
  --surface: #121722;
  --surface-2: #1a2130;
  --ink: #e9edf3;
  --ink-2: #b3bbc8;
  --ink-3: #8b94a4;
  --line: #222a39;
  --accent: #5ab9fc;
  --accent-2: #12283c;
  --accent-ink: #0a0d14;
  --good: #3ecf8e;
  --good-bg: #0f2a20;
  --bad: #ff6b6b;
  --bad-bg: #331418;
  --warn: #f2b84b;
  --warn-bg: #2f240e;
  --c1: #c98500;
  --c2: #d55181;
  --c3: #199e70;
  --seq-1: #15283f;
  --seq-2: #1c5cab;
  --seq-3: #3987e5;
  --seq-4: #9ec5f4;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .3);
  --f-display: "Host Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Host Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 4px;
  --r-sm: 4px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #e9edf3; --surface: #f7f9fc; --surface-2: #dde2ea; --ink: #0a0d14; --ink-2: #3c4250; --ink-3: #4f5561;
    --line: #cdd3dd; --accent: #1769b0; --accent-2: #d8e7f5; --accent-ink: #ffffff; --good: #0e8a55; --good-bg: #d7efe3;
    --bad: #c8352f; --bad-bg: #f6dcdb; --warn: #8a5a00; --warn-bg: #f3e7cf; --c1: #b57800; --c2: #c2457a; --c3: #148a62;
    --seq-1: #cde2fb; --seq-2: #86b6ef; --seq-3: #2a78d6; --seq-4: #184f95;
    --shadow: 0 1px 2px rgba(10, 13, 20, .06), 0 8px 24px rgba(10, 13, 20, .08); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #e9edf3; --surface: #f7f9fc; --surface-2: #dde2ea; --ink: #0a0d14; --ink-2: #3c4250; --ink-3: #4f5561;
  --line: #cdd3dd; --accent: #1769b0; --accent-2: #d8e7f5; --accent-ink: #ffffff; --good: #0e8a55; --good-bg: #d7efe3;
  --bad: #c8352f; --bad-bg: #f6dcdb; --warn: #8a5a00; --warn-bg: #f3e7cf; --c1: #b57800; --c2: #c2457a; --c3: #148a62;
  --seq-1: #cde2fb; --seq-2: #86b6ef; --seq-3: #2a78d6; --seq-4: #184f95;
  --shadow: 0 1px 2px rgba(10, 13, 20, .06), 0 8px 24px rgba(10, 13, 20, .08); color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14.5px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 40px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.02em; }
h1 { font-size: clamp(26px, 4vw, 40px); font-weight: 600; letter-spacing: -.035em; }
h2 { font-size: clamp(19px, 2.4vw, 23px); font-weight: 600; letter-spacing: -.025em; }
h3 { font-size: 16px; font-weight: 600; }
h4 { font-size: 14.5px; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); font-size: 13px; }
.hl { color: var(--accent); }
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 500; }

/* Układ: menu boczne i treść */
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 16px; max-width: 1480px; margin: 0 auto; align-items: start; }
.side { position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); height: calc(100vh - 24px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 10px; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); padding: 4px 8px 14px; }
.brand b { font-family: var(--f-display); font-size: 16px; font-weight: 600; letter-spacing: -.02em; white-space: nowrap; }
.brand svg { flex: none; }
.tabs { display: flex; flex-direction: column; gap: 2px; }
.tabs a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r); color: var(--ink-2); text-decoration: none; font-weight: 500; font-size: 14px; min-height: 38px; transition: background 150ms var(--ease), color 150ms var(--ease); }
.tabs a svg { flex: none; opacity: .85; }
.tabs a:hover { color: var(--ink); background: var(--surface-2); }
.tabs a[aria-current="page"] { color: var(--accent); background: var(--accent-2); font-weight: 600; }
.tabs a[aria-current="page"] svg { opacity: 1; }
.tabs a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.side-foot { margin-top: auto; padding: 12px 8px 2px; display: grid; gap: 6px; border-top: 1px solid var(--line); }
.status { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.side-foot .faint { font-family: var(--f-mono); font-size: 11.5px; }
.content { min-width: 0; display: grid; gap: 14px; }
.tape { display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px; }
.tape::-webkit-scrollbar { display: none; }
.tape a, .tape .tk { flex: none; display: flex; gap: 8px; align-items: baseline; padding: 6px 10px; border-radius: var(--r); text-decoration: none; color: var(--ink-2); font-family: var(--f-mono); font-size: 12.5px; white-space: nowrap; transition: background 150ms var(--ease); }
.tape a:hover { background: var(--surface-2); }
.tape a b, .tape .tk b { color: var(--ink); font-weight: 500; font-family: var(--f-body); font-size: 13px; }
.tape .status-m { display: none; margin-left: auto; padding-right: 6px; flex: none; }
main { display: grid; gap: 22px; padding-top: 6px; min-width: 0; }
section { display: grid; gap: 14px; min-width: 0; }
@media (max-width: 980px) {
  .app { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; height: auto; flex-direction: row; align-items: center; padding: 6px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .side::-webkit-scrollbar { display: none; }
  .brand { padding: 4px 8px; }
  .brand b { display: none; }
  .tabs { flex-direction: row; }
  .tabs a { flex: none; white-space: nowrap; padding: 8px 10px; }
  .side-foot { display: none; }
  .tape .status-m { display: flex; }
}

/* Elementy */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.card.raised { box-shadow: var(--shadow); }
.card.flat { background: transparent; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: grid; gap: 8px; }
.stack-lg { display: grid; gap: 14px; }
.split { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
@media (max-width: 900px) { .split { grid-template-columns: minmax(0, 1fr); } }

.btn { font: inherit; font-weight: 600; font-size: 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 8px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; line-height: 1.3; }
.btn { transition: transform 150ms var(--ease), border-color 150ms var(--ease), background 150ms var(--ease); }
.btn:hover { border-color: var(--ink-3); transform: translateY(-1px); }
.btn:active { transform: translateY(1px) scale(.985); transition-duration: 90ms; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); border-color: color-mix(in srgb, var(--accent) 86%, var(--ink)); }
.btn.good { background: var(--good); border-color: var(--good); color: var(--surface); }
.btn.bad { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 6px; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }

.seg { display: inline-flex; background: var(--surface-2); border-radius: var(--r); padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { font: inherit; font-size: 13px; font-weight: 500; border: 0; background: transparent; color: var(--ink-2); padding: 5px 10px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 500; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.accent { background: var(--accent-2); color: var(--accent); }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
button.chip { border: 1px solid transparent; cursor: pointer; font: inherit; font-size: 12.5px; }
button.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-2); color: var(--accent); font-weight: 600; }

label.field { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); font-weight: 500; min-width: 0; }
input, select, textarea { font: inherit; font-size: 14.5px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 10px; min-width: 0; width: 100%; }
input[type="checkbox"] { width: auto; accent-color: var(--accent); }
input[type="number"] { font-family: var(--f-mono); }
textarea { resize: vertical; min-height: 64px; }
.fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); align-items: end; }
.hint { font-size: 12.5px; color: var(--ink-3); font-weight: 400; }

.stat { display: grid; gap: 2px; min-width: 0; }
.stat .k { font-size: 12.5px; color: var(--ink-2); font-weight: 500; }
.stat .v { font-family: var(--f-mono); font-size: 21px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stat .s { font-size: 12.5px; color: var(--ink-3); }
.stats { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.pos { color: var(--good); }
.neg { color: var(--bad); }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 600; background: var(--surface); position: sticky; top: 0; }
td.r, th.r { text-align: right; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover { background: var(--surface-2); }
td .wrap { white-space: normal; }

.note { border-radius: var(--r); padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
.note.info { background: var(--accent-2); color: var(--ink); }
.note.warn { background: var(--warn-bg); color: var(--ink); }
.note.bad { background: var(--bad-bg); color: var(--ink); }
.note.good { background: var(--good-bg); color: var(--ink); }
.note b { font-weight: 600; }
.note svg { flex: none; margin-top: 2px; }

.check { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.check:last-child { border-bottom: 0; }
.check .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; margin-top: 1px; }
.ic.ok { background: var(--good-bg); color: var(--good); }
.ic.no { background: var(--bad-bg); color: var(--bad); }
.ic.wa { background: var(--warn-bg); color: var(--warn); }
.ic.na { background: var(--surface-2); color: var(--ink-3); }

.verdict { font-family: var(--f-display); font-size: 20px; font-weight: 600; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.big-pass, .big-block { font-family: var(--f-mono); font-weight: 500; font-size: 13px; padding: 3px 10px; border-radius: 6px; letter-spacing: .04em; }
.big-pass { background: var(--good-bg); color: var(--good); }
.big-block { background: var(--bad-bg); color: var(--bad); }

.chart-box { position: relative; width: 100%; }
.chart-box canvas { display: block; width: 100%; touch-action: pan-y; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: var(--r); padding: 8px 10px; font-size: 12.5px; line-height: 1.45; min-width: 150px; z-index: 2; font-variant-numeric: tabular-nums; }
.tip b { font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }

.lesson { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.lesson > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; }
.lesson > summary::-webkit-details-marker { display: none; }
.lesson .no { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-size: 13px; background: var(--surface-2); color: var(--ink-2); }
.lesson.done .no { background: var(--good-bg); color: var(--good); }
.lesson .body { padding: 0 16px 16px 58px; display: grid; gap: 10px; max-width: 760px; }
@media (max-width: 600px) { .lesson .body { padding-left: 16px; } }
.quiz { display: grid; gap: 6px; margin-top: 6px; }
.quiz button { text-align: left; font: inherit; font-size: 14px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; cursor: pointer; }
.quiz button:hover { border-color: var(--ink-3); }
.quiz button.right { border-color: var(--good); background: var(--good-bg); }
.quiz button.wrong { border-color: var(--bad); background: var(--bad-bg); }
.key { font-weight: 600; }

.path { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); counter-reset: step; }
.step { position: relative; display: grid; gap: 6px; padding: 14px 14px 14px 50px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: var(--ink); }
.step:hover { border-color: var(--accent); }
.step::before { counter-increment: step; content: counter(step); position: absolute; left: 14px; top: 14px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-family: var(--f-mono); font-size: 13px; color: var(--ink-2); }
.step.done::before { content: "✓"; background: var(--good-bg); color: var(--good); font-weight: 700; }
.step b { font-family: var(--f-display); font-size: 16px; font-weight: 650; }
.step span { font-size: 13px; color: var(--ink-2); }

.hero { display: grid; gap: 14px; padding-block: 6px 4px; max-width: 820px; }
.hero p { font-size: 17px; color: var(--ink-2); max-width: 64ch; }

.mentor { border: 1px dashed var(--accent); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; background: var(--surface); }
.mentor .out { font-size: 14.5px; display: grid; gap: 8px; max-width: 72ch; }
.mentor .out ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.mentor .out:empty { display: none; }

.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; font-family: var(--f-mono); text-align: right; font-variant-numeric: tabular-nums; }

.metric { display: grid; gap: 4px; padding: 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); min-width: 0; }
.metric .t { font-size: 13px; color: var(--ink-2); font-weight: 500; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.metric .v { font-family: var(--f-mono); font-size: 20px; font-variant-numeric: tabular-nums; }
.metric .x { font-size: 13px; color: var(--ink-2); }

.log { display: grid; gap: 4px; font-size: 13.5px; max-height: 220px; overflow: auto; }
.log div { padding: 4px 0; border-bottom: 1px dashed var(--line); }
.overlay { position: fixed; inset: 0; background: rgba(8, 12, 24, .45); z-index: 20; display: grid; place-items: center; padding: 16px; }
.dialog { background: var(--surface); border-radius: 12px; max-width: 460px; width: 100%; padding: 20px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: var(--r); font-size: 14px; z-index: 30; box-shadow: var(--shadow); }
details.more > summary { cursor: pointer; color: var(--accent); font-weight: 500; font-size: 14px; }
details.more[open] > summary { margin-bottom: 10px; }
.linkish { font: inherit; background: none; border: 0; padding: 0; color: var(--ink); cursor: pointer; text-align: left; }
.linkish:hover b { text-decoration: underline; }
.linkish:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
a.chip { text-decoration: none; }
.loading { padding: 60px 0; text-align: center; color: var(--ink-2); }
@media (prefers-reduced-motion: reduce) { .btn, .tabs a, .tape a { transition: none; } .btn:hover, .btn:active { transform: none; } }
@media (prefers-reduced-motion: no-preference) {
  .fade { animation: fade .25s ease both; }
  @keyframes fade { from { opacity: .4; transform: translateY(3px); } to { opacity: 1; transform: none; } }
}
@media (max-width: 600px) {
  body { font-size: 14.5px; }
  .card { padding: 14px; }
  .stat .v { font-size: 19px; }
}
</style>

<div class="app">
  <aside class="side">
    <a class="brand" href="#start" aria-label="Giełda od Zera, strona startowa">
      <svg width="28" height="28" viewBox="0 0 30 30" aria-hidden="true">
        <rect x="1" y="1" width="28" height="28" rx="6" fill="var(--ink)"/>
        <line x1="9" y1="7" x2="9" y2="21" stroke="var(--bg)" stroke-width="1.6"/>
        <rect x="6.5" y="11" width="5" height="7" rx="1" fill="var(--bg)"/>
        <line x1="15" y1="5" x2="15" y2="18" stroke="var(--bg)" stroke-width="1.6"/>
        <rect x="12.5" y="8" width="5" height="6" rx="1" fill="var(--bg)"/>
        <line x1="21" y1="4" x2="21" y2="15" stroke="var(--accent)" stroke-width="1.6"/>
        <rect x="18.5" y="6" width="5" height="6" rx="1" fill="var(--accent)"/>
        <rect x="5" y="23" width="20" height="2" rx="1" fill="var(--accent)"/>
      </svg>
      <b>Giełda od Zera</b>
