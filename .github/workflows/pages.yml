# Codziennie po sesji w USA: pobiera notowania, buduje stronę i publikuje ją na GitHub Pages.
# Uruchamia się też po każdym wysłaniu zmian (push) i ręcznie (Actions -> Run workflow).
name: Notowania i strona

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 22 * * 1-5" # 23:15 czasu polskiego zimą, 00:15 latem (GitHub bywa spóźniony o kilkanaście minut)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pobierz najnowsze notowania
        id: data
        continue-on-error: true # gdy Yahoo nie odpowie, strona zbuduje się na ostatnich zapisanych danych
        run: node tools/update-data.mjs

      - name: Zapisz datę notowań (utrzymuje harmonogram aktywnym)
        # GitHub wyłącza harmonogram w repozytorium bez zmian przez 60 dni, więc zapisujemy jeden mały plik
        if: github.event_name == 'schedule' && steps.data.outcome == 'success'
        run: |
          node -e "const d=require('./data.json');require('fs').writeFileSync('last-update.txt', d.as_of + '\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add last-update.txt
          git diff --cached --quiet || (git commit -m "Notowania do $(cat last-update.txt)" && git push)

      - name: Zbuduj stronę
        run: node tools/build-site.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
